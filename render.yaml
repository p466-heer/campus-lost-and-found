services:
  - type: web
    name: campus-lost-and-found
    runtime: docker
    plan: free
    healthCheckPath: /actuator/health
    autoDeployTrigger: checksPass
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        fromDatabase:
          name: campus-lost-and-found-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: campus-lost-and-found-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: campus-lost-and-found-db
          property: database
      - key: DATABASE_USERNAME
        fromDatabase:
          name: campus-lost-and-found-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: campus-lost-and-found-db
          property: password

databases:
  - name: campus-lost-and-found-db
    plan: free
    databaseName: campus_lost_and_found
    user: lostandfound
