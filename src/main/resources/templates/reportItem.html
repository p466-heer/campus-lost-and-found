<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Report a Found Item</title>
</head>
<body>
<h1>Report a Found Item</h1>

<form th:action="@{/items/report}" th:object="${foundItem}" method="post">
    <div>
        <label for="name">Item Name:</label>
        <input type="text" id="name" th:field="*{name}">
        <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
    </div>

    <div>
        <label for="description">Description:</label>
        <textarea id="description" th:field="*{description}"></textarea>
        <span th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></span>
    </div>

    <div>
        <label for="foundLocation">Found Location:</label>
        <input type="text" id="foundLocation" th:field="*{foundLocation}">
        <span th:if="${#fields.hasErrors('foundLocation')}" th:errors="*{foundLocation}"></span>
    </div>

    <button type="submit">Submit Report</button>
</form>

<p><a th:href="@{/items}">Back to Found Items</a></p>
</body>
</html>
